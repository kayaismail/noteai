# =============================================================================
# Appium Android Automation Framework - Konfigürasyon Dosyası
# =============================================================================
#
# HIZLI BAŞLANGIÇ REHBERİ:
#   1. Telefonu USB ile bağla, USB Debugging'i aç
#   2. Terminalde çalıştır:
#        adb devices                                    → device.name değeri
#        adb shell getprop ro.build.version.release     → platform.version
#        adb shell dumpsys window | grep mCurrentFocus  → app.package + app.activity
#   3. Aşağıdaki TODO alanlarını doldur ve kaydet
#   4. Appium server'ı başlat: appium --port 4723
#   5. mvn test -Dtest=OnboardingTest
#
# =============================================================================

# ── Appium Server ─────────────────────────────────────────────────────────────
# Appium server'ı başlatmak için: appium --port 4723
appium.server.url=http://127.0.0.1:4723

# ── Android Cihaz Bilgileri ───────────────────────────────────────────────────
# Samsung Galaxy A52s — adb devices çıktısı: R58R42MLJXX
device.name=SM-A525F
platform.version=14

# ── Uygulama Bilgileri ────────────────────────────────────────────────────────
# TODO: Uygulamayı telefonda aç, sonra terminalde çalıştır:
#       adb shell dumpsys window | grep mCurrentFocus
# Çıktı: mCurrentFocus=Window{... <app.package>/<app.activity>}
# Örnek: com.example.noteai / com.example.noteai.SplashActivity

app.package=com.hubx.noteai
app.activity=com.hubx.noteai.MainActivity

# Onboarding testi için false bırak — her çalışmada uygulama sıfırdan başlasın
# (onboarding tekrar görünür olsun)
no.reset=false

# ── Test Kullanıcısı ──────────────────────────────────────────────────────────
# Onboarding sonrası login gerektiren testler için kullanılır
test.username=testuser@example.com
test.password=Test@1234

# ── Bekleme Süreleri (saniye) ─────────────────────────────────────────────────
# Yavaş bir cihazda sorun yaşıyorsan bu değerleri artır
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# ── Android SDK Path (ANDROID_HOME env variable tanımlı değilse kullanılır) ──
android.sdk.path=C:\\Users\\Şeyma Kaya\\AppData\\Local\\Android\\Sdk

# ── Raporlama ─────────────────────────────────────────────────────────────────
report.output.dir=test-output/reports
screenshot.dir=test-output/screenshots
